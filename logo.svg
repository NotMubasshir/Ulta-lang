<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Transparent background with chaotic neon-orange styling -->
  <defs>
    <filter id="chaos-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feOffset dx="2" dy="-2" result="offset" />
      <feComposite in="SourceGraphic" in2="offset" operator="over" />
    </filter>
  </defs>

  <!-- Outer rough polygon border -->
  <polygon points="25,35 175,15 185,165 35,185" fill="none" stroke="#FF5500" stroke-width="4" stroke-dasharray="12, 4, 3, 4" />
  
  <!-- Inner filled transparent geometric badge -->
  <polygon points="15,25 165,10 175,155 25,170" fill="#FF5500" fill-opacity="0.12" stroke="#FF3300" stroke-width="2" />

  <!-- ULTA text in the middle with a chaotic glitch/rotation -->
  <text x="50%" y="52%" dominant-baseline="middle" text-anchor="middle" font-family="Courier New, monospace" font-weight="900" font-size="38" fill="#FF2200" filter="url(#chaos-glow)" transform="rotate(-4 100 100)">
    ULTA
  </text>
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Courier New, monospace" font-weight="900" font-size="38" fill="#FF7700" transform="rotate(-4 100 100)">
    ULTA
  </text>
</svg>
